<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 170" fill="none">
  <!-- ASD Mascot: Friendly cloud character with a little leaf friend -->
  <!-- Shadow -->
  <ellipse cx="130" cy="155" rx="90" ry="8" fill="#B2DFDB" opacity=".5"/>
  <!-- Cloud body -->
  <ellipse cx="130" cy="88" rx="78" ry="52" fill="#E8F8F5" stroke="#80CBC4" stroke-width="3"/>
  <circle cx="82" cy="80" r="32" fill="#E8F8F5" stroke="#80CBC4" stroke-width="3"/>
  <circle cx="178" cy="80" r="32" fill="#E8F8F5" stroke="#80CBC4" stroke-width="3"/>
  <circle cx="110" cy="52" r="28" fill="#E8F8F5" stroke="#80CBC4" stroke-width="3"/>
  <circle cx="150" cy="55" r="26" fill="#E8F8F5" stroke="#80CBC4" stroke-width="3"/>
  <!-- Fill overlaps -->
  <ellipse cx="130" cy="88" rx="75" ry="48" fill="#E8F8F5"/>
  <circle cx="82" cy="80" r="29" fill="#E8F8F5"/>
  <circle cx="178" cy="80" r="29" fill="#E8F8F5"/>
  <circle cx="110" cy="52" r="25" fill="#E8F8F5"/>
  <circle cx="150" cy="55" r="23" fill="#E8F8F5"/>
  <!-- Eyes -->
  <ellipse cx="112" cy="82" rx="5" ry="6" fill="#2D4A45"/>
  <ellipse cx="148" cy="82" rx="5" ry="6" fill="#2D4A45"/>
  <!-- Eye shine -->
  <circle cx="114" cy="79" r="2" fill="white"/>
  <circle cx="150" cy="79" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M118 97c5 7 15 7 20 0" stroke="#2D4A45" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Blush cheeks -->
  <ellipse cx="98" cy="93" rx="8" ry="5" fill="#FFB5B5" opacity=".6"/>
  <ellipse cx="160" cy="93" rx="8" ry="5" fill="#FFB5B5" opacity=".6"/>
  <!-- Little leaf friend on top -->
  <path d="M155 38c8-14 22-12 22-2 6-2 8 4 4 8-4 12-18 14-26 6Z" fill="#66BB6A" stroke="#43A047" stroke-width="2"/>
  <line x1="158" y1="40" x2="170" y2="30" stroke="#43A047" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sparkle decorations -->
  <g transform="translate(40,45)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#80CBC4" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#80CBC4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(210,50) scale(0.7)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#A5D6A7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#A5D6A7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Small heart -->
  <path d="M38 110c-3-6-10-7-12-3-3-5-10-5-12-1 0 7 12 14 12 14s12-7 12-14Z" fill="#FFB5B5" opacity=".7" transform="translate(0,-15) scale(0.8)"/>
</svg>